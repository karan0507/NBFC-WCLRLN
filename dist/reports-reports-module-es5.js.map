<section>
    <nz-card>
        <div class="row">
            <div class='col-8'>
                <nz-form-item>
                    <nz-form-label  nzFor="bill_date" class="text-left">Select Preferred Report</nz-form-label>
                    <nz-form-control nzErrorTip="Please select Type">
                        <nz-select nzShowSearch nzPlaceHolder="Please Select" (ngModelChange)="onChange($event)" [(ngModel)]="selectedRole">
                            <nz-option *ngFor="let item of reportList" [nzValue]="item?.url"
                            [nzLabel]="item.name">
                            </nz-option>
                        </nz-select>
                    </nz-form-control>
                    </nz-form-item>
            </div>
            <div class='col-4' *ngIf="selectedRole != 'total-outstanding-report-corporate-wise'">
                <nz-range-picker class="mx-1 mb-2" style=" width: 18rem;" [(ngModel)]="date" [nzDisabledDate]="disabledDate" (ngModelChange)="onClickCheckDate()" [nzRanges]="customRanges"></nz-range-picker>
            </div>
            <!-- <span *ngIf="selectedRole == 'total-outstanding-report-corporate-wise'">
                <div [class]="selectedRole == 'total-outstanding-report-corporate-wise' ? 'col-5' : 'col-4'">
                    <nz-select [(ngModel)]="partner" nzMode="multiple" style="width: 15rem;" class="mx-1 my-md-0 mb-3" (nzOnSearch)="OnTypeSearchList($event)" (ngModelChange)="onClickUpdateCorporate()" nzAllowClear
                        [nzMaxTagCount]="1" [nzSize]="'small'" nzPlaceHolder="Select Partner">
                        <nz-option *ngFor="let item of partnerList" [nzValue]="item.pk"
                            [nzLabel]="item.name">
                        </nz-option>
                    </nz-select>
                </div>
            </span> -->
        </div>
        <div class="row" *ngIf="selectedRole == 'total-outstanding-report-corporate-wise'">
            <div class="col-12">
                <span class="mr-4">
                    <nz-range-picker class="mx-1 mb-2" style=" width: 18rem;" [(ngModel)]="date" [nzDisabledDate]="disabledDate" (ngModelChange)="onClickCheckDate()" [nzRanges]="customRanges"></nz-range-picker>
                </span>
                <span>
                    <nz-select [(ngModel)]="partner" nzMode="multiple" style="width: 15rem;" class="mx-1 my-md-0 mb-3" (nzOnSearch)="OnTypeSearchList($event)" (ngModelChange)="onClickUpdateCorporate()" nzAllowClear
                        [nzMaxTagCount]="1" [nzSize]="'small'" nzPlaceHolder="Select Partner">
                        <nz-option *ngFor="let item of partnerList" [nzValue]="item.pk"
                            [nzLabel]="item.name">
                        </nz-option>
                    </nz-select>
                </span>
            </div>
            <!-- <div class="col-5">
                <div [class]="selectedRole == 'total-outstanding-report-corporate-wise' ? 'col-5' : 'col-4'">
                    <nz-select [(ngModel)]="partner" nzMode="multiple" style="width: 15rem;" class="mx-1 my-md-0 mb-3" (nzOnSearch)="OnTypeSearchList($event)" (ngModelChange)="onClickUpdateCorporate()" nzAllowClear
                        [nzMaxTagCount]="1" [nzSize]="'small'" nzPlaceHolder="Select Partner">
                        <nz-option *ngFor="let item of partnerList" [nzValue]="item.pk"
                            [nzLabel]="item.name">
                        </nz-option>
                    </nz-select>
                </div>
            </div> -->
        </div>
        <div class="row">
            <div class="col-12" style="text-align: right;">
                <button [nzLoading]="apiLoader['onOk']" [disabled]="!selectedRole"  (click)="downloadReportOnClick()" nz-button nzType="primary">Download Report</button>          
            </div>
        </div>
    </nz-card>
</section>

    (nzFocus)="onFocusMethod('partner')" (ngModelChange)="getFormLoanData()" nzAllowClear
    [nzMaxTagCount]="1" [nzSize]="'small'" nzPlaceHolder="Select Partner">
    <nz-option *ngFor="let item of partnerList" [nzValue]="item.pk"
