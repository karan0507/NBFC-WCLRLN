<section *ngIf="!loading">
    <nz-card [nzActions]="[actionSubmit]">
        <form nz-form [formGroup]="createEditForm">
            <ng-container *ngFor="let item of get_master_partner_arr(createEditForm); let k = index;"
                formArrayName="master_partner_arr">
                <div class="row mb-3" [formGroupName]="k">
                    <nz-divider *ngIf="k > 0"></nz-divider>
                    <label class="text-left d-flex ml-auto mx-2 pointer" nz-popconfirm nzPopconfirmTitle="Are you sure remove partner?"
                        nzPopconfirmPlacement="topLeft" (nzOnConfirm)="removeMaster(item, k)" *ngIf="k > 0">
                        <i nz-icon nzType="close-circle" class="font-size-24 text-danger" nzTheme="outline"></i>
                    </label>
                    <div class="col-md-12">
                        <nz-form-item>
                            <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="name" class="text-left">Master Partner's
                                Name</nz-form-label>
                            <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please input Master Partner's  Name!">
                                <nz-select formControlName="name" nzPlaceHolder="Select Master Partner's  Name!"
                                    (nzFocus)="fetchMasterPartnerData()" nzShowSearch nzAllowClear>
                                    <nz-option nzValue="" nzLabel="No master">
                                    </nz-option>
                                    <nz-option *ngFor="let item of masterParnerData" [nzValue]="item.pk" [nzLabel]="item.name">
                                    </nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                    <div class="col-md-12">
                        <nz-form-item>
                            <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="partnersName" class="text-left" nzRequired>Partner's Name
                            </nz-form-label>
                            <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please input Partner's  Name!">
                                <nz-select formControlName="partnersName" nzPlaceHolder="Select Partner's  Name!" nzMode="multiple"
                                    (nzFocus)="fetchPartnerData()" nzShowSearch nzAllowClear>
                                    <nz-option *ngFor="let item of partnerData" [nzValue]="item.pk" [nzLabel]="item.name">
                                    </nz-option>
                                </nz-select>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                    <!-- <div class="col-md-12">
                                        <nz-form-item>
                                            <nz-form-label [nzSm]="7" [nzXs]="24" nzFor="no_of_partner" class="text-left" nzRequired>No. of
                                                Partners</nz-form-label>
                                            <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please input No. of Partners!">
                                                <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="no_of_partner"
                                                    placeholder="Please input No. of Partners!" />
                                            </nz-form-control>
                                        </nz-form-item>
                                    </div> -->
                    <div class="col-md-12">
                        <nz-form-item>
                            <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="amount_per_partner" class="text-left text-wrap" nzRequired>
                                commission per partner (at acquisition)</nz-form-label>
                            <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please input commission per partner (at acquisition)!">
                                <!-- <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="amount_per_partner"
                                                    placeholder="Please input commission per partner (at acquisition)!" /> -->
                                <nz-input-group [nzAddOnAfter]="addOnAfterTemplateforamt">
                                    <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="amount_per_partner"
                                        placeholder="Please input commission per partner (at acquisition)!" />
                                </nz-input-group>
            
                                <ng-template #addOnAfterTemplateforamt>
                                    <nz-select formControlName="amount_include_gst">
                                        <nz-option [nzLabel]="'excluding GST'" [nzValue]="false"></nz-option>
                                        <nz-option [nzLabel]="'including GST'" [nzValue]="true"></nz-option>
                                    </nz-select>
                                </ng-template>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                    <!-- <nz-divider class="mt-0"></nz-divider>
                    <div class="col-md-12">
                        <div class="row">
                            <nz-form-label class="w-100 text-left">At the time of acquisition of partners
                            </nz-form-label>
                            <div class="col-md-8">
                                <nz-form-label class="w-100 text-left">Commission based on Transaction Amount
                                </nz-form-label>
                                <ng-container *ngFor="let slab_item of get_slab_array(item); let i = index;" formArrayName="slab_array">
                                    <div class="col-md-12 px-0" [formGroupName]="i">
                                        <nz-form-label class="w-100 text-left">Slab {{i + 1}}

                                            <div class="col-md-11 d-flex align-items-center">
                                                <nz-form-control>
                                                    <input nz-input type="number" (keydown)="http.restrictType($event)" min="1" name="min_amount" formControlName="min_amount"
                                                        id="min_amount" placeHolder="Start Range">
                                                </nz-form-control>
                                                <label class="text-left d-flex mx-2">To</label>
                                                <nz-form-control>
                                                    <input nz-input type="number" (keydown)="http.restrictType($event)" min="1" name="max_amount" formControlName="max_amount"
                                                        id="max_amount" placeHolder="End Range">
                                                </nz-form-control>
                                                <label class="text-left d-flex mx-2">&</label>
                                                <nz-form-control>
                                                    <nz-input-group [nzAddOnAfter]="addOnAfterTemplate">
                                                        <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" name="commission" formControlName="commission"
                                                            id="commission" placeHolder="commission %">
                                                    </nz-input-group>
                        
                                                    <ng-template #addOnAfterTemplate>
                                                        <span>%</span>
                                                    </ng-template>
                                                </nz-form-control>
                                            </div>
                                            <label class="text-left d-flex mx-2 pointer" nz-popconfirm nzPopconfirmTitle="Are you sure delete Slab?"

                                            </label>
                                        </div>
                                    </div>
                                </ng-container>
                                <button nz-button nzType="link" class="mt-3" (click)="addSlabpartners(k)">+ Add more Slabs</button>
                            </div>
                        </div>
                    </div> -->

                    <nz-divider></nz-divider>
                    <div class="col-md-12">
                        <!-- <form nz-form [formGroup]="slap_based_form_Acquisition_Customers"> -->
                        <div class="row">
                            <nz-form-label class="w-100 text-left">At the time of acquisition of customers
                            </nz-form-label>
                            <div class="col-md-8">
                                <nz-form-label class="w-100 text-left">Commission based on Transaction Amount
                                </nz-form-label>
                                <ng-container *ngFor="let slab_item of get_slab_array_Acquisition_Customers(item); let i = index;"
                                    formArrayName="slab_array_Acquisition_Customers">
                                    <div class="col-md-12 px-0 mb-3" [formGroupName]="i">
                                        <nz-form-label class="w-100 text-left">Slab {{i + 1}}
                                        </nz-form-label>
                                        <div class="row mx-0 d-flex align-items-center">
                                            <div class="col-md-11 d-flex align-items-center">
                                                <nz-form-control>
                                                    <input nz-input type="number" (keydown)="http.restrictType($event)" min="1" name="min_amount" formControlName="min_amount"
                                                        id="min_amount" placeHolder="Start Range">
                                                    <!-- <div *ngIf="item.get('min_amount').value" class="mt-2">₹ {{ item.get('min_amount').value ? item.get('min_amount').value : ''}}</div> -->
                                                </nz-form-control>
                                                <label class="text-left d-flex mx-2">To</label>
                                                <nz-form-control>
                                                    <input nz-input type="number" (keydown)="http.restrictType($event)" min="1" name="max_amount" formControlName="max_amount"
                                                        id="max_amount" placeHolder="End Range">
                                                    <!-- <div *ngIf="item.get('max_amount').value" class="mt-2">₹ {{ item.get('max_amount').value ? item.get('max_amount').value : ''}}</div> -->
                                                </nz-form-control>
                                                <label class="text-left d-flex mx-2">&</label>
                                                <nz-form-control>
                                                    <nz-input-group [nzAddOnAfter]="addOnAfterTemplate">
                                                        <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" name="commission" formControlName="commission"
                                                            id="commission" placeHolder="commission ₹">
                                                    </nz-input-group>
                        
                                                    <ng-template #addOnAfterTemplate>
                                                        <nz-select formControlName="commission_calculation_type">
                                                            <nz-option [nzLabel]="'₹'" [nzValue]="'Flat'"></nz-option>
                                                            <nz-option [nzLabel]="'%'" [nzValue]="'Variable'"></nz-option>
                                                        </nz-select>
                                                    </ng-template>
                                                </nz-form-control>
                                            </div>
                                            <!-- <label class="text-left d-flex mx-2 pointer" *ngIf="i == 0"> -->
                                            <!-- <span class="font-size-24"></span></label> -->
                                            <label class="text-left d-flex mx-2 pointer" nz-popconfirm nzPopconfirmTitle="Are you sure delete Slab?"
                                                nzPopconfirmPlacement="topLeft" (nzOnConfirm)="removeSlabAcquisitionCustomers(slab_item, k, i)" *ngIf="i > 0 && !router.url.includes('view-product')">
                                                <i nz-icon nzType="close-circle" class="font-size-24 text-danger" nzTheme="outline"></i>
                                            </label>
                                        </div>
                                    </div>
                                </ng-container>
                                
                                <a class="mt-3 p-3" (click)="add_Acquisition_Customers(k)">+ Add more
                                    Slabs</a>
                            </div>
                        </div>
                        <!-- </form> -->
                    </div>
                </div>
            </ng-container>
        </form>
    </nz-card>
    
    <ng-template #actionSubmit>
        <div class="row no-gutters" *ngIf="!router.url.includes('view-product')">
            <div class="col-12 d-flex justify-content-between px-4">
                <button nz-button nzType="link" (click)="addMasterPartner()">+Add another Partner</button>
                <button nz-button nzType="primary"
                    [disabled]="(createEditForm.invalid)" [nzLoading]="isloading"
                    (click)="submitForm()">Submit</button>
            </div>
        </div>
    </ng-template>
</section>
