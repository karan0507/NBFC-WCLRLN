<section>
    <nz-card [nzActions]="[actionSubmit]">
        <form nz-form [formGroup]="createEditForm">
            <div class="row">
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="5" [nzXs]="24" nzFor="first_txn_limit" class="text-left text-wrap"
                            >First Transaction Max Limit</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24"
                            nzErrorTip="Please input First Transaction Max Limit!">
                                <nz-input-group [nzAddOnAfter]="addOnAfterTemplateforamt">
                                    <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="first_txn_limit"
                                placeholder="Please input First Transaction Max Limit!" />
                                </nz-input-group>
                                
                                <ng-template #addOnAfterTemplateforamt>
                                    <span>%</span>
                                </ng-template>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="5" [nzXs]="24" nzFor="global_txn_limit" class="text-left text-wrap"
                            >Global Limit</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24"
                            nzErrorTip="Please input Global Limit!">
                                <nz-input-group [nzAddOnAfter]="addOnAfterTemplateforamt1">
                                    <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="global_txn_limit"
                                placeholder="Please input Global Limit!" />
                                </nz-input-group>
                                
                                <ng-template #addOnAfterTemplateforamt1>
                                    <span>₹</span>
                                </ng-template>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="5" [nzXs]="24" nzFor="daily_txn_limit" class="text-left text-wrap"
                            >Max Number of Transactions</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24"
                            nzErrorTip="Please input Number of Transactions!">
                                <nz-input-group>
                                    <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="daily_txn_limit"
                                placeholder="Please input Number of Transactions!" />
                                </nz-input-group>
                                
                                <!-- <ng-template #addOnAfterTemplateforamt>
                                    <span>₹</span>
                                </ng-template> -->
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <nz-form-label [nzSm]="24" [nzXs]="24" class="text-left text-wrap">Disbursement</nz-form-label>
                <div class="col-md-6">
                    <nz-form-item>
                        <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="disbursement_min_amount" class="text-left" >Minimum (₹)</nz-form-label>
                        <nz-form-control nzErrorTip="Please input Minimum Amount (₹)!">
                            <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="disbursement_min_amount"
                                placeholder="Please input Minimum Amount (₹)!" />
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-6">
                    <nz-form-item>
                        <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="disbursement_max_amount" class="text-left" >Maximum (₹)</nz-form-label>
                        <nz-form-control nzErrorTip="Please input Maximum Amount (₹)!">
                            <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="disbursement_max_amount"
                                placeholder="Please input Maximum Amount (₹)!" />
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <nz-form-label [nzSm]="24" [nzXs]="24" class="text-left text-wrap">Interest</nz-form-label>
                <div class="col-md-6">
                    <nz-form-item>
                        <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="interest_min_percentage" class="text-left" >Minimum (%)</nz-form-label>
                        
                        <nz-form-control nzErrorTip="Please input Minimum Amount (%)!">
                            <nz-input-group [nzAddOnAfter]="addOnAfterTemplate">
                                <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" name="interest_min_percentage" formControlName="interest_min_percentage"
                                    id="interest_min_percentage" placeHolder="Enter Minimum Amount (%)">
                            </nz-input-group>
                        
                            <ng-template #addOnAfterTemplate>
                                <span>%</span>
                            </ng-template>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-6">
                    <nz-form-item>
                        <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="interest_max_percentage" class="text-left" >Maximum(%)</nz-form-label>
                        <nz-form-control nzErrorTip="Please input Maximum Amount (%)!">
                            <nz-input-group [nzAddOnAfter]="addOnAfterTemplate">
                                <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" name="interest_max_percentage" formControlName="interest_max_percentage"
                                    id="interest_max_percentage" placeHolder="Enter Maximum Amount(%)">
                            </nz-input-group>
                        
                            <ng-template #addOnAfterTemplate>
                                <span>%</span>
                            </ng-template>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <nz-form-label [nzSm]="24" [nzXs]="24" class="text-left text-wrap">Limit</nz-form-label>
                <div class="col-md-6">
                    <nz-form-item>
                        <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="global_min_limit" class="text-left" >Minimum (₹)</nz-form-label>
                        <nz-form-control nzErrorTip="Please input Minimum Amount (₹)!">
                            <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="global_min_limit"
                                placeholder="Please input Minimum Amount (₹)!" />
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-6">
                    <nz-form-item>
                        <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="global_max_limit" class="text-left" >Maximum (₹)</nz-form-label>
                        <nz-form-control nzErrorTip="Please input Maximum Amount (₹)!">
                            <input nz-input type="number" (keydown)="http.restrictType($event)" min="0" formControlName="global_max_limit"
                                placeholder="Please input Maximum Amount (₹)!" />
                        </nz-form-control>
                    </nz-form-item>
                </div>
            </div>
        </form>
    </nz-card>
    
    <ng-template #actionSubmit>
        <div class="row no-gutters" *ngIf="!router.url.includes('view-product')">
            <div class="col-12 d-flex justify-content-end px-4">
                <button nz-button nzType="primary" [disabled]="createEditForm.invalid" [nzLoading]="loading" (click)="submitForm()">Submit</button>
            </div>
        </div>
    </ng-template>
</section>
