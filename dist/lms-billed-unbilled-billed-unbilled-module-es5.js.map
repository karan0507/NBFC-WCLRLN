<section>
    <!-- <nz-card nzTitle="Latest bill">
        <div class="row">
            <div class="col-md-9">

            </div>
        </div>
    </nz-card> -->
    <nz-card nzTitle="Previous bills">
        <nz-table [nzLoading]="api_calling_loader" [nzFrontPagination]="false" [nzShowSizeChanger]="false"[nzData]="previous_bill">
            <thead>
                <tr>
                    <th nzWidth="3rem">#</th>
                    <th nzWidth="15rem">Bill date</th>
                    <th>Due date</th>
                    <th nzWidth="6rem" nzRight>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let data of previous_bill; index as i">
                    <td>{{i+1}}</td>
                    <!-- *ngIf="page === 1" <td *ngIf="page > 1">{{((page-1)*globalPageSize)+(i+1)}}</td> -->
                    <td>{{ data?.bill_date ? (data?.bill_date | date: 'medium') : '-' }}</td>
                    <td>{{ data?.due_date ? (data?.due_date | date: 'medium') : '-'}}</td>
                    <td nzRight>
                        <a (click)="pdfViewerAndDownload(data?.bill_file, data?.bill_date)">view</a>
                    </td>
                </tr>
            </tbody>
        </nz-table>
        <!-- <div class="total_count_text" *ngIf="total_count">
            <b>Total Count : </b>{{total_count}}
        </div> -->
    </nz-card>
</section>

<nz-modal [(nzVisible)]="pdf_viewer_object_values['boolean']" nzWidth="60vw" nzKeyboard="true"
      [nzTitle]="pdf_viewer_object_values['title']" (nzOnCancel)="handleCancel()" [nzFooter]="modalFooter">
      <ng-container *nzModalContent>
            <div class="pdf_viewer_container">
                  <embed [src]="pdf_viewer_object_values['url']" width="100%" height="100%" />
            </div>
      </ng-container>
      <ng-template #modalFooter>
            <button nz-button nzType="primary" (click)="handleCancel()">Close</button>
      </ng-template>
</nz-modal>
