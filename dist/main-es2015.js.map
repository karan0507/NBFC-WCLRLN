<div class="container-fluid p-v-20 h-100">
    <div class="d-flex flex-column justify-content-between h-100">
        <div class="p-h-40">
            <img class="img-fluid" alt="" src="assets/images/logo/logo.png">
        </div>
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8 m-h-auto">
                    <div class="text-center m-b-50">
                        <h1 class="font-weight-semibold display-1 text-primary lh-1-2">403</h1>
                        <!-- <img class="img-fluid w-90" src="assets/images/others/error-2.png" alt=""> -->
                        <i nz-icon nzType="lock" style="font-size: 60px;" nzTheme="outline"></i>
                        <!-- <h2 class="font-weight-light font-size-30 m-t-60 m-b-20">Sorry, we're down for maintenance...</h2> -->
                        <p class="w-70 lh-1-8 m-h-auto font-size-17 m-t-60">You don't have permissions to  access this page. <br> 
                        Contact an administrator to get permissions.
                        </p>
                    </div>
                    <div class="col-md-12">
                        <div class="p-v-30 text-center">
                            <!-- <h1 class="font-weight-semibold display-1 text-primary lh-1-2">404</h1>
                            <h2 class="font-weight-light font-size-30">Whoops! Looks like you got lost</h2> -->
                            <!-- <p class="lead m-b-30">We couldn't find what you were looking for.</p> -->
                            <a (click)="onClickRedirectToAssignedRouter()"  nz-button nzType="primary">Go Back</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex p-h-40 justify-content-between">
            <!-- <span class="">© 2019 ThemeNate</span>
            <ul class="list-inline">
                <li class="list-inline-item">
                    <a class="text-dark text-link" href="">Legal</a>
                </li>
                <li class="list-inline-item">
                    <a class="text-dark text-link" href="">Privacy</a>
                </li>
            </ul> -->
        </div>
    </div>
</div>
