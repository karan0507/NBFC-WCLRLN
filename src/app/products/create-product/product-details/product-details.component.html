<section>
    <nz-card nzTitle="Add Product Details" [nzActions]="[actionSubmit]">
        <form nz-form [formGroup]="createEditForm">
            <div class="row">
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="name" class="text-left" nzRequired>Product Name</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please input Product Name!">
                            <input nz-input type="text" formControlName="name" />
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="product_master" class="text-left" nzRequired>Master Product</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please select Master Product!">
                            <nz-radio-group formControlName="product_master">
                                <label nz-radio nzValue="1">Fatak Pay</label>
                                <label nz-radio nzValue="2">Fatak Pay EMI</label>
                              </nz-radio-group>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="default_nbfc_id" class="text-left" nzRequired>Default NBFS</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please select Default NBFS!">
                            <nz-select formControlName="default_nbfc_id" nzPlaceHolder="Select Default NBFS">
                                <nz-option *ngFor="let item of nbfcsList" [nzValue]="item.pk" [nzLabel]="item.name"></nz-option>
                            </nz-select>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="product_code" class="text-left" nzRequired>Product Code</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please input Product Code!">
                            <input nz-input type="text" formControlName="product_code" />
                        </nz-form-control>
                        <nz-form-label class="ml-auto">Created at</nz-form-label>
                        <nz-form-label [nzNoColon]="true">-</nz-form-label>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="activation_date" class="text-left" nzRequired>Activation Date</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please select Activation Date!">
                            <nz-date-picker formControlName="activation_date" [nzFormat]="'YYYY-MM-DD'"></nz-date-picker>
                        </nz-form-control>
                        <nz-form-label class="ml-auto">Created by</nz-form-label>
                        <nz-form-label [nzNoColon]="true">-</nz-form-label>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="inactivation_date" class="text-left">Inactivation Date</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please select Inactivation Date!">
                            <nz-date-picker formControlName="inactivation_date" [nzFormat]="'YYYY-MM-DD'"></nz-date-picker>
                        </nz-form-control>
                        <nz-form-label class="ml-auto">Updated at</nz-form-label>
                        <nz-form-label [nzNoColon]="true">-</nz-form-label>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="instructions" class="text-left" nzRequired>Remarks</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please select Remarks!">
                            <textarea nz-input formControlName="instructions"></textarea>
                        </nz-form-control>
                        <nz-form-label class="ml-auto">Updated by</nz-form-label>
                        <nz-form-label [nzNoColon]="true">-</nz-form-label>
                    </nz-form-item>
                </div>
                <h5 *ngIf="createEditForm.get('product_master').value == '2'">EMI Tenure</h5>
                <div class="col-md-12" *ngIf="createEditForm.get('product_master').value == '2'">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="tenure" class="text-left" nzRequired>Select Tenure</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please select Tenure!">
                            <nz-select formControlName="tenure" nzPlaceHolder="Select Tenure">
                                <nz-option *ngFor="let item of tenureList" [nzValue]="item.value" [nzLabel]="item.name"></nz-option>
                            </nz-select>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12" *ngIf="createEditForm.get('product_master').value == '2'">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="rate_of_interest" class="text-left" nzRequired>Interest Rate(%)</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please input Interest Rate(%)!">
                            <!-- <input nz-input type="number" min="0" formControlName="rate_of_interest" /> -->
                            <nz-input-group [nzAddOnAfter]="addOnAfterTemplate">
                                <input nz-input type="number" min="0" formControlName="rate_of_interest" />
                            </nz-input-group>
                              <ng-template #addOnAfterTemplate>
                                <span>%</span>
                            </ng-template>
                        </nz-form-control>
                    </nz-form-item>
                </div>
            </div>
        </form>
    </nz-card>
    <ng-template #actionSubmit>
        <div class="row no-gutters">
            <div class="col-12 d-flex justify-content-end px-4">
                <button nz-button nzType="primary" [disabled]="createEditForm.invalid" (click)="submitForm()">Submit</button>
            </div>
        </div>
    </ng-template>
</section>
