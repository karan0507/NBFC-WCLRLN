<section>
    <nz-card [nzActions]="[actionSubmit]">
        <div class="row mb-md-3">
            <nz-radio-group [(ngModel)]="selectedTab" nzButtonStyle="solid">
                <label nz-radio-button class="mr-md-2 mr-2 px-4 mb-md-0 mb-3 border-radius-2" *ngFor="let item of employmentTypeData"
                    [nzValue]="item.pk">{{item.name}}</label>
            </nz-radio-group>
        </div>
        <form nz-form [formGroup]="createEditForm">
            <div class="row mb-3">
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="7" [nzXs]="24" nzFor="blacklist_pincodes" class="text-left" nzRequired>Negative Pincodes</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please input Negative Pincodes!">
                            <nz-select formControlName="blacklist_pincodes" nzPlaceHolder="Select Negative Pincodes!" nzMode="tags"
                                [nzTokenSeparators]="[',']" nzShowSearch nzAllowClear>
                            </nz-select>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="7" [nzXs]="24" nzFor="servicable_pincodes" class="text-left" nzRequired>Servicable Pincodes</nz-form-label>
                        <nz-form-control [nzSm]="8" [nzXs]="24" nzErrorTip="Please input Servicable Pincodes!">
                            <nz-select formControlName="servicable_pincodes" nzPlaceHolder="Select Servicable Pincodes!" nzMode="tags"
                                [nzTokenSeparators]="[',']" nzShowSearch nzAllowClear>
                            </nz-select>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <nz-divider></nz-divider>
                <ng-container *ngFor="let item of get_underwritingArr(createEditForm); let k = index;"
                    formArrayName="range_entities">
                    <nz-form-label class="text-left" nzNoColon>{{item.controls.name.value?.toString().toUpperCase()}}</nz-form-label>
                    <div class="col-md-12" [formGroupName]="k">
                        <div class="row">
                            <div class="col-md-6">
                                <nz-form-item>
                                    <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="min" class="text-left text-overflow-break pr-md-2 text-capitalize" nzRequired>{{item.controls.min_label.value}}</nz-form-label>
                                    <nz-form-control [nzSm]="10" [nzXs]="24" nzErrorTip="Please input {{item.controls.min_label.value}}!">
                                        <input nz-input type="number" min="0" formControlName="min"
                                            placeholder="Please input {{item.controls.min_label.value}}!" />
                                    </nz-form-control>
                                </nz-form-item>
                            </div>
                            <div class="col-md-6">
                                <nz-form-item>
                                    <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="max" class="text-left text-overflow-break pr-md-2 text-capitalize" nzRequired>{{item.controls.max_label.value}}</nz-form-label>
                                    <nz-form-control [nzSm]="10" [nzXs]="24" nzErrorTip="Please input {{item.controls.max_label.value}}!">
                                        <input nz-input type="number" min="0" formControlName="max"
                                            placeholder="Please input {{item.controls.max_label.value}}!" />
                                    </nz-form-control>
                                </nz-form-item>
                            </div>
                        </div>
                    </div>
                </ng-container>
                <!-- <nz-divider></nz-divider>
                <nz-form-label class="text-left w-100">Validation Required for</nz-form-label>
                <ng-container *ngFor="let item of get_underwritingvalidation_entitiesArr(createEditForm); let k = index;"
                    formArrayName="validation_entities">
                    <div class="col-md-12" [formGroupName]="k">
                        <nz-form-item>
                            <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="value" class="text-left text-overflow-break pr-md-2 text-capitalize"
                                nzRequired>
                                {{item.controls.name.value}}</nz-form-label>
                            <nz-form-control [nzSm]="10" [nzXs]="24" nzErrorTip="Please input {{item.controls.name.value}}!">                            
                                <nz-radio-group formControlName="value">
                                    <label nz-radio [nzValue]="'Yes'">Yes</label>
                                    <label nz-radio [nzValue]="'No'">No</label>
                                </nz-radio-group>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                </ng-container> -->
                <nz-divider></nz-divider>
                <ng-container *ngFor="let item of get_underwritingcomparison_entitiesArr(createEditForm); let k = index;"
                    formArrayName="comparison_entities">
                    <div class="col-md-6" [formGroupName]="k">
                        <nz-form-item>
                            <nz-form-label [nzSm]="10" [nzXs]="24" nzFor="value" class="text-left text-overflow-break pr-md-2 text-capitalize" nzRequired>
                                {{item.controls.name.value}}</nz-form-label>
                            <nz-form-control [nzSm]="10" [nzXs]="24" nzErrorTip="Please input {{item.controls.name.value}}!">
                                <nz-input-group nzAddOnBefore="{{item.controls.comparison_operator.value}}">
                                    <input nz-input type="number" min="0" formControlName="value"
                                    placeholder="Please input {{item.controls.name.value}}!" />
                                </nz-input-group>
                            </nz-form-control>
                        </nz-form-item>
                    </div>
                </ng-container>
            </div>
        </form>
    </nz-card>
    
    <ng-template #actionSubmit>
        <div class="row no-gutters" *ngIf="!router.url.includes('view-product')">
            <div class="col-12 d-flex justify-content-end px-4">
                <!-- <button nz-button nzType="link" (click)="isVisible = true">+Add another Rule</button> -->
                <button nz-button nzType="primary" [disabled]="createEditForm.invalid" [nzLoading]="loading" (click)="submitForm()">Submit</button>
            </div>
        </div>
    </ng-template>
</section>
