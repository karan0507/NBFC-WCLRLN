<section>
    <nz-card [nzActions]="[actionSubmit]">
        <div class="col-12">
            <nz-radio-group [(ngModel)]="radioValue" class="w-100" [nzDisabled]="router.url.includes('view-product')">
                <label nz-radio *ngFor="let item of loanAgreementDataMaster" [nzValue]="item.id" class="mb-3">{{item.name}} <a class="float-right" (click)="modalPreview(item)">view</a></label> 
            </nz-radio-group>
        </div>
    </nz-card>
    
    <ng-template #actionSubmit>
        <div class="row no-gutters">
            <div class="col-12 d-flex justify-content-end px-4">
                <button nz-button nzType="primary" [nzLoading]="loading" (click)="submitForm()">Submit</button>
            </div>
        </div>
    </ng-template>
</section>

<nz-modal [(nzVisible)]="pdf_viewer_object_values['boolean']" nzWidth="60vw" nzKeyboard="true"
	[nzTitle]="pdf_viewer_object_values['title']" (nzOnCancel)="handleCancel()" [nzFooter]="modalFooter">
	<ng-container *nzModalContent>
		<div class="pdf_viewer_container">
			<embed [src]="sanatizeUrlToSafe(pdf_viewer_object_values['url'])" width="100%" height="400px" />
		</div>
	</ng-container>
	<ng-template #modalFooter>
		<button nz-button nzType="primary" (click)="handleCancel()">Close</button>
	</ng-template>
</nz-modal>
