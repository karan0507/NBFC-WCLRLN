<div class="header_breadcrumb_section">
    <button nz-button nzType="default" (click)="isUpload = true">Upload</button>
</div>
<section>
    <div class="row mb-md-3">
        <div class="col-md-12 mb-md-0">
            <nz-radio-group [(ngModel)]="selectedTab" (ngModelChange)='onClickChangeTab($event)'>
                <label nz-radio-button class="mr-md-2 mr-2 px-4 mb-md-0 mb-3 border-radius-2" nzValue="1">User Terminate/Unblock</label>
                <label nz-radio-button class="mr-md-2 mr-2 px-4 mb-md-0 mb-3 border-radius-2" nzValue="2">Line Block/Unblock</label>
                <label nz-radio-button class="mr-md-2 mr-2 px-4 mb-md-0 mb-3 border-radius-2" nzValue="3">A/c Block/Unblock</label>
                <label nz-radio-button class="mr-md-2 mr-2 px-4 mb-md-0 mb-3 border-radius-2" nzValue="4">Credit Line Inc./Dec.</label>
            </nz-radio-group>
        </div>
    </div>
</section>
<section *ngIf="selectedTab == '1'">
    <app-user-terminate-unblock></app-user-terminate-unblock>
</section>
<section *ngIf="selectedTab == '2'">
    <app-line-block-unblock></app-line-block-unblock>
</section>
<section *ngIf="selectedTab == '3'">
    <app-account-block-unblock></app-account-block-unblock>
</section>
<section *ngIf="selectedTab == '4'">
    <app-credit-line-inc-dec></app-credit-line-inc-dec>
</section>
<!-- Upload -->
<nz-modal [(nzVisible)]="isUpload" nzTitle="Upload" [nzFooter]="null" (nzOnCancel)="isUpload = false" nzOkText="Submit">
    <ng-container *nzModalContent>
        <div class="row">
            <div class="col-md-12">
                <nz-upload nzType="drag" [nzMultiple]="true" (nzChange)="handleChange($event)">
                    <p class="ant-upload-text">Drag and Drop file here</p>
                    <p class="ant-upload-text">or</p>
                    <button class="mt-md-4" nz-button nzType="primary" (click)="isPreview = true; isUpload = false">Browse</button>
                </nz-upload>
            </div>
        </div>
    </ng-container>
</nz-modal>
<!-- Preview -->
<nz-modal [nzWidth]="'max-content'" [(nzVisible)]="isPreview" nzTitle="Preview for :  6677789.xls" (nzOnCancel)="isPreview = false" (nzOnOk)="isPreview = false;"
nzOkText="Upload">
    <ng-container *nzModalContent>
        <div class="row">
            <div class="col-md-12">
                <nz-table [nzData]="borrowertList">
                    <!-- [nzFrontPagination]="true" [nzTotal]="total_count" [nzPageIndex]="page" [nzPageSize]="globalPageSize" [nzShowPagination]="true" [nzLoading]="api_calling_loader" -->
                    <thead>
                        <tr>
                            <th nzWidth="3rem">#</th>
                            <th>User Name</th>
                            <th>Mobile No.</th>
                            <th>Email -ID</th>
                            <th>Loan ID</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let data of borrowertList; index as i">
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                    </tbody>
                </nz-table>
            </div>
        </div>
    </ng-container>
</nz-modal>
