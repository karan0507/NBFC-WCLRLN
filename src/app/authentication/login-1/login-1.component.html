<div class="container-fluid p-0 h-100">
    <div class="row no-gutters h-100">
        <div class="col-lg-7 d-none d-lg-flex">
            <div class="d-flex bg-white w-100 p-h-40 p-v-15 flex-column justify-content-between align-items-center">
                <nz-carousel nzAutoPlay>
                    <div nz-carousel-content *ngFor="let img of carousel_data">
                      <img [src]="img" alt="" class="mx-auto pt-md-5 mt-md-5">
                    </div>
                  </nz-carousel>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="container h-100">
                <div class="row no-gutters h-100 align-items-center">
                    <div class="col-md-9 col-lg-9 col-xl-8 mx-auto">
                        <img src="assets/images/logo/logo.png" alt="" class="w-50 mb-5">
                        <h2>Lets Get Started</h2>
                        <!-- <p class="m-b-30">Enter your credential to get access</p> -->
                        <form nz-form [formGroup]="loginForm" nzLayout="vertical" class="login-form" (ngSubmit)="submitForm(loginForm)">
                            <nz-form-item>
                                <nz-form-label nzRequired nzFor="mobile">Username</nz-form-label>
                                <nz-form-control nzErrorTip="Please input your username!">
                                    <nz-input-group [nzPrefix]="prefixUser">
                                        <input type="text" nz-input formControlName="mobile" placeholder="Username">
                                    </nz-input-group>
                                </nz-form-control>
                            </nz-form-item>
                            <nz-form-item>
                                <nz-form-label nzRequired nzFor="password">Password</nz-form-label>
                                <nz-form-control nzErrorTip="Please input your Password!">
                                    <nz-input-group [nzPrefix]="prefixLock">
                                        <input type="password" nz-input formControlName="password" placeholder="Password">
                                    </nz-input-group>
                                </nz-form-control>
                            </nz-form-item>
                            <div>
                                <div class="font-size-13 p-t-10 text-right w-100">
                                    <a [routerLink]="['/authentication/reset-password-1']">Forget
                                        Password?</a>
                                </div>
                                <button nz-button class="w-100 mb-5 mt-3" [nzLoading]="api_calling_loader" [nzType]="'primary'">Login</button>
                                <div class="d-flex align-items-center justify-content-between">
                                    <span class="font-size-13">Privacy policy</span>
                                </div>
                            </div>
                        </form>
                        <ng-template #prefixUser><i nz-icon nzType="user"></i></ng-template>
                        <ng-template #prefixLock><i nz-icon nzType="lock"></i></ng-template>
                    </div>
                </div>  
            </div>
        </div>
    </div>
</div>
