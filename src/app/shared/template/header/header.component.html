<div class="header">
    <div class="logo logo-dark d-flex align-items-center">
        <a href="" class="w-100">
            <img class="w-50" src="assets/images/logo/logo.png" alt="Logo">
            <img class="logo-fold" src="assets/images/logo/logo-fold.png" alt="Logo">
        </a>
    </div>
    <div class="logo logo-white">
        <a href="">
            <img class="w-50" src="assets/images/logo/logo.png" alt="Logo">
            <img class="logo-fold" src="assets/images/logo/logo-fold-white.png" alt="Logo">
        </a>
    </div>
    <div class="nav-wrap">
        <ul class="nav-left">
            <li class="desktop-toggle">
                <a (click)="toggleFold()">
                    <i nz-icon [nzType]="isFolded? 'menu-unfold':'menu-fold'" theme="outline"></i>
                </a>
            </li>
            <li class="mobile-toggle">
                <a (click)="toggleExpand()">
                    <i nz-icon [nzType]="isExpand? 'menu-fold': 'menu-unfold'" theme="outline"></i>
                </a>
            </li>
        </ul>
        <ul class="nav-right">
            <li>
                <a (click)="quickViewToggle()" style="border-radius: 50%;">
                    <i nz-icon nzType="user" nzTheme="outline"></i>
                </a>
                <nz-drawer [nzWidth]="480" nzTitle="" [nzClosable]="false" [nzVisible]="quickViewVisible" nzPlacement="right"
                    (nzOnClose)="quickViewToggle()">
                    <div class="row">
                        <div class="d-flex align-items-center pointer" (click)="quickViewToggle()">
                            <i nz-icon nzType="arrow-left" class="mr-3" nzTheme="outline"></i>
                            <h5 class="h5 mb-0">Back</h5>
                        </div>
                    </div>
                    <app-quick-view></app-quick-view>
                </nz-drawer>
            </li>
        </ul>
    </div>
</div>
