<div class="row p-3">
    <div class="col-md-12 d-flex justify-content-center mb-3">
        <img [src]="icon" alt="" width="120">
    </div>
    <div class="col-md-12 d-flex justify-content-center mb-3">
        <h4 class="h4 text-center">{{title}}</h4>
    </div>
    <div class="col-md-12 text-center mb-5">
        <p>{{subTitle}}</p>
    </div>
    <div class="col-md-12 d-flex justify-content-center">
        <button nz-button nzType="default" (click)="onCencelCall.emit()"
            class="mr-3">{{cancelBtnTxt}}</button>
        <button nz-button nzType="primary" (click)="onOkCall.emit()">{{submitBtnTxt}}</button>
    </div>
</div>
