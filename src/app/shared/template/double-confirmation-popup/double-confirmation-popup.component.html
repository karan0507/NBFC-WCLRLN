<div class="row p-3">
    <div class="col-md-12 d-flex justify-content-center mb-3" [style]="icon ? 'min-height: 6rem' :''" >
        <img [src]="icon" alt="" width="120" sty>
    </div>
    <div class="col-md-12 d-flex justify-content-center mb-3" *ngIf="title">
        <h4 class="h4 text-center">{{title}}</h4>
    </div>
    <div class="col-md-12 text-center mb-5" *ngIf="subTitle">
        <p [innerHtml]="subTitle"></p>
    </div>
    <div class="col-md-12 d-flex justify-content-center">
        <button nz-button nzType="primary" nzGhost (click)="onCencelCall.emit()" *ngIf="cancelBtnTxt"
            class="mr-3">{{cancelBtnTxt}}</button>
        <button nz-button nzType="primary" (click)="onOkCall.emit()" *ngIf="submitBtnTxt" [nzLoading]="isbtnLoading">{{submitBtnTxt}}</button>
    </div>
</div>
