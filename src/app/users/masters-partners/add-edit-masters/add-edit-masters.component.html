<section>
    <nz-card>
        <form nz-form [formGroup]="addEditProductForm" >
            <div class="row border-bottom">
                <div class="col-12 my-2 d-flex">
                    <div class="text-width">
                        Master’s Name
                    </div>
                    <div>
                        <input class="input-width" nzSize="small" nz-input formControlName="name" type="text"
                            placeholder="Enter Name" />
                    </div>
                </div>
                <div class="col-12 my-2 d-flex">
                    <div class="text-width">
                        Address Line 1
                    </div>
                    <div>
                        <input class="input-width" nz-input nzSize="small" formControlName="address_line_1" type="text"
                            placeholder="Address" />
                    </div>
                </div>
                <div class="col-12 my-2 d-flex">
                    <div class="text-width">
                        Address line 2
                    </div>
                    <div>
                        <input class="input-width" nz-input nzSize="small" formControlName="address_line_2" type="text"
                            placeholder="Enter Address" />
                    </div>
                </div>
                <div class="col-12 my-2 d-flex">
                    <div class="text-width">
                        City
                    </div>
                    <div>
                        <input class="input-width" nz-input nzSize="small" formControlName="city" type="text"
                            placeholder="Enter City" />
                    </div>
                </div>
                <div class="col-12 my-2 d-flex">
                    <div class="text-width">
                        State/Region
                    </div>
                    <div>
                        <input class="input-width" nz-input nzSize="small" formControlName="state" type="text"
                            placeholder="Enter State" />
                    </div>
                </div>
                <div class="col-12 my-2 d-flex">
                    <div class="text-width">
                        Pin Code
                    </div>
                    <div>
                        <input class="input-width" nz-input nzSize="small" formControlName="pincode" type="text"
                            placeholder="Enter Pin Code" />
                    </div>
                </div>
                <div class="col-12 my-2 d-flex">
                    <div class="text-width">
                        Phone No
                    </div>
                    <div>
                        <input class="input-width" nzSize="small" nz-input formControlName="phone" type="text"
                            id="credit" placeholder="Enter Phone No" />
                    </div>
                </div>
            </div>
            <div class="mt-2">
                <h5>
                    Business Details
                </h5>
            </div>
            <div class="row border-bottom">
                <div class="col-6 my-2 d-flex">
                    <div class="text-width">
                        Type
                    </div>
                    <div>
                        <input class="input-width" nzSize="small" nz-input formControlName="business_type" type="text"
                            id="credit" placeholder="Enter Code" />
                    </div>
                </div>
                <div class="col-6 my-2 d-flex">
                    <div class="text-width">
                        Nature
                    </div>
                    <div>
                        <input class="input-width" nz-input nzSize="small" formControlName="business_nature" type="text"
                            id="credit" placeholder="Enter Code" />
                    </div>
                </div>
            </div>
            <div class="mt-2">
                <h5>
                    Contact Personal Details
                </h5>
            </div>
            <div class="row border-bottom">
                <div class="col-6 my-2 d-flex">
                    <div class="text-width">
                        Name
                    </div>
                    <div>
                        <input class="input-width" nzSize="small" nz-input formControlName="contact_person_name" type="text"
                            id="credit" placeholder="Contact Person Name" />
                    </div>
                </div>
                <div class="col-6 my-2 d-flex">
                    <div class="text-width">
                        Phone No.
                    </div>
                    <div>
                        <input class="input-width" nz-input nzSize="small" formControlName="contact_person_phone" type="text"
                            id="credit" placeholder="Enter Code" />
                    </div>
                </div>
                <div class="col-12 my-2 d-flex">
                    <div class="text-width">
                        Email Id
                    </div>
                    <div>
                        <input class="input-width" nz-input nzSize="small" formControlName="contact_person_email" type="text"
                            id="credit" placeholder="Enter Code" />
                    </div>
                </div>
                <div class="mt-2">
                    <h6>
                        Banking Details
                    </h6>
                </div>
                <div class="row">
                    <div class="col-6 my-2 d-flex">
                        <div class="text-width">
                            Bank Name
                        </div>
                        <div>
                            <input class="input-width" nzSize="small" nz-input formControlName="bank_name" type="text"
                                id="credit" placeholder="Enter Code" />
                        </div>
                    </div>
                    <div class="col-6 my-2 d-flex">
                        <div class="text-width">
                            A/c No.
                        </div>
                        <div>
                            <input class="input-width" nz-input nzSize="small" formControlName="account_no" type="text"
                                id="credit" placeholder="Enter Code" />
                        </div>
                    </div>
                    <div class="col-6 my-2 d-flex">
                        <div class="text-width">
                            IFSC Code
                        </div>
                        <div>
                            <input class="input-width" nz-input nzSize="small" formControlName="ifsc" type="text"
                                id="credit" placeholder="Enter Code" />
                        </div>
                    </div>
                    <div class="col-6 my-2 d-flex">
                        <div class="text-width">
                            Branch
                        </div>
                        <div>
                            <input class="input-width" nz-input nzSize="small" formControlName="branch" type="text"
                                id="credit" placeholder="Enter Code" />
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-2">
                <h5>
                    KYC Documents
                </h5>
            </div>


            <!-- <div class="row border-bottom">
                <div class="col-6 my-2 d-flex">
                    <div class="text-width">
                        Pan
                    </div>
                    <div>
                        upload & Verified
                    </div>
                </div>
                <div class="col-6 my-2 d-flex">
                    <div class="text-width">
                        Aadhaar
                    </div>
                    <div>
                        <a>+Upload</a>
                    </div>
                </div>
            </div> -->

            <div formArrayName="document_data">
                <div *ngFor="let skill of skills.controls; let i=index">
                  <div [formGroupName]="i">
                    <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="name" class="text-left" nzRequired>{{skill?.controls.label_name.value}}</nz-form-label>
                    
                    <!-- <nz-upload
                    [nzMultiple]="'false'" [nzAccept]="'.png, .jpg, .pdf'"
                    [nzBeforeUpload]="beforeUpload"
                  >
                    <button nz-button>
                      <i nz-icon nzType="upload"></i>
                      Click to Upload
                    </button>
                  </nz-upload> -->
                  <input type='file' form (change)="onChange($event, i)" />
                  <!--[nzBeforeUpload]="beforeUpload" <input type="file" formControlName="documents" > -->
                  </div>
                </div>
              </div>
              <!-- <button type="button" (click)='addSkills()'>Add</button> -->
 
            
            <div class="row">
                <div class="col-12 d-flex">
                    <div class="text-width">
                        Employee
                    </div>
                    <div>
                        <!-- <input class="input-width" nz-input nzSize="small" formControlName="account_no" type="text"
                        id="credit" placeholder="Enter Code" /> -->
                        <nz-radio-group formControlName = 'employee'>
                            <label nz-radio nzValue="yes">Yes</label>
                            <label nz-radio nzValue="no">No</label>
                            <label nz-radio nzValue="n/a">N/A</label>
                          </nz-radio-group>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 d-flex">
                    <div class="text-width">
                        Payout
                    </div>
                    <div>
                        <!-- <input class="input-width" nz-input nzSize="small" formControlName="account_no" type="text"
                        id="credit" placeholder="Enter Code" /> -->
                        <!-- <label nz-radio formControl='employee' nzValue="yes">Yes</label>
                        <label nz-radio formControl='employee' nzValue="no">no</label>
                        <label nz-radio formControl='employee' nzValue="n/a">N/A</label> -->
                        <nz-radio-group formControlName = 'payout'>
                            <label nz-radio nzValue="yes">Yes</label>
                            <label nz-radio nzValue="no">No</label>
                            <label nz-radio nzValue="n/a">N/A</label>
                          </nz-radio-group>
                    </div>
                </div>
            </div>


        </form>
    </nz-card>
    <div class="row my-3 justify-content-between">
        <div class="col-3">
            <button nz-button nzType="default">Reset</button>
        </div>
        <div class="col-3 text-right">
            <button type="submit" (click)="onClickSubmitForm()" nz-button nzType="primary">Save</button>
        </div>

    </div>
</section>
