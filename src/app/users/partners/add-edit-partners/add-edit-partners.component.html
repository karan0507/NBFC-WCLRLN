<section>
    <nz-card>
        <form nz-form [formGroup]="addEditProductForm">
            <div class="row border-bottom">
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="name" class="text-left" nzRequired>Corporate Name</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Add Valid Corporate Name!">
                            <input nz-input type="text" formControlName="name"  placeholder="Corporate Name"/>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="address_line_1" class="text-left" nzRequired>Address Line 1</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Add Valid Address!">
                            <input nz-input type="text" formControlName="address_line_1" placeholder="Address Line 1"/>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="address_line_2" class="text-left" nzRequired>Address line 2</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Add Valid Address line 2!">
                            <input nz-input type="text" formControlName="address_line_2"  placeholder="Address Line 2"/>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="city" class="text-left" nzRequired>City</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Add Valid City!">
                            <input nz-input type="text" formControlName="city"  placeholder="City"/>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="state" class="text-left" nzRequired>State</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please select Valid Sate">
                            <nz-select formControlName="state" nzPlaceHolder="Select State"
                                (nzFocus)="getListOfStates()" nzShowSearch nzAllowClear
                                (nzOnSearch)="onSearchGetList($event, 'state')">
                                <nz-option *ngFor="let item of stateArr" [nzValue]="item.id"
                                    [nzLabel]="item.name">
                                </nz-option>
                            </nz-select>
                        </nz-form-control>
                    </nz-form-item>
                    <!-- <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="state" class="text-left" nzRequired>State/Region</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Add Valid State!">
                            <input nz-input type="text" formControlName="state"  placeholder="State"/>
                        </nz-form-control>
                    </nz-form-item> -->
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="pincode" class="text-left" nzRequired>Pin Code</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Add Valid Pincode!">
                            <input nz-input type="number" formControlName="pincode"  placeholder="Pincode"/>
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="phone" class="text-left" nzRequired>Phone No</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Add Valid Phone No.!">
                            <input nz-input type="number" formControlName="phone"  placeholder="Phone No."/>
                        </nz-form-control>
                        <!-- item.controls.label_name.value -->
                        <!-- <p *ngIf="addEditProductForm.get('phone').hasError('required') && !addEditProductForm.get('phone').pristine">
                            Firstname is required
                        </p> -->
                    </nz-form-item>
                </div>
                <!-- (nzFocus)="searchStaticDataGlobalFunction('employee', 1)" -->
                <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="partner_master" class="text-left" nzRequired>Refereed By</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Select Valid Master Partner!">
                        <nz-select nzAllowClear nzShowSearch class="mr-2 width" [nzAllowClear]='false' nzPlaceHolder="Select Master Partner"
                         (keyup)="getListOfMasterPartner($event?.target.value)" formControlName="partner_master">
                        <ng-container *ngFor="let item of listOfMasterPartner" nzCustomContent>
                            <nz-option *ngIf="item?.name"  [nzValue]="item?.pk" [nzLabel]="item?.name"></nz-option>
                        </ng-container>
                      </nz-select>
                    </nz-form-control>
                    </nz-form-item>
                </div>
                <!-- <div class="col-md-12">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="unique_code" class="text-left" nzRequired>Unique Code</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Add Valid Unique Code!">
                            <input nz-input type="text" formControlName="unique_code"  placeholder="Unique Code."/>
                        </nz-form-control>
                    </nz-form-item>
                </div> -->
            </div>
            <div class="mt-2">
                <h5>
                    Contact Personal Details
                </h5>
            </div>
            <div class="row border-bottom">
                <div class="col-md-6">
                    <nz-form-item>
                        <nz-form-label [nzSm]="8" [nzXs]="24" nzFor="contact_person_name" class="text-left" nzRequired>Name</nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please Add Valid Name!">
                            <input nz-input type="text" formControlName="contact_person_name"  placeholder="Person Name" />
                        </nz-form-control>
                    </nz-form-item>
                </div>
                <div class="col-md-6">
                    <nz-form-item>
                        <nz-form-label [nzSm]="8" [nzXs]="24" nzFor="contact_person_phone" class="text-left" nzRequired>Phone No.</nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please Add Valid Phone No!">
                            <input nz-input type="text" formControlName="contact_person_phone"  placeholder="person Phone No."/>
                        </nz-form-control>
                    </nz-form-item>
                </div>

                <div class="col-md-6">
                    <nz-form-item>
                        <nz-form-label [nzSm]="8" [nzXs]="24" nzFor="contact_person_email" class="text-left" nzRequired>Email Id</nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please Add Valid Email!">
                            <input nz-input type="text" formControlName="contact_person_email"  placeholder="Person Email"/>
                        </nz-form-control>
                    </nz-form-item>
                </div>


                <div class="row">
                    <div class="col-12">
                        <div class="mt-2">
                            <h6>
                                Banking Details 
                            </h6>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <nz-form-item>
                            <nz-form-label [nzSm]="8" [nzXs]="24" nzFor="bank_name" class="text-left" nzRequired>Bank Name</nz-form-label>
                            <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please Add Valid Bank Name!">
                                <input nz-input type="text" formControlName="bank_name"  placeholder="Bank Name"/>
                            </nz-form-control>
                        </nz-form-item>
                    </div>

                    <div class="col-md-6">
                        <nz-form-item>
                            <nz-form-label [nzSm]="8" [nzXs]="24" nzFor="account_no" class="text-left" nzRequired>A/c No.</nz-form-label>
                            <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please Add Valid Account No.!">
                                <input nz-input type="text" formControlName="account_no"  placeholder="Account No."/>
                            </nz-form-control>
                        </nz-form-item>
                    </div>

                    <div class="col-md-6">
                        <nz-form-item>
                            <nz-form-label [nzSm]="8" [nzXs]="24" nzFor="ifsc" class="text-left" nzRequired>IFSC Code</nz-form-label>
                            <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please Add Valid IFsC!">
                                <input nz-input type="text" formControlName="ifsc"  placeholder="IFSC" />
                            </nz-form-control>
                        </nz-form-item>
                    </div>

                    <div class="col-md-6">
                        <nz-form-item>
                            <nz-form-label [nzSm]="8" [nzXs]="24" nzFor="branch" class="text-left" nzRequired>Branch</nz-form-label>
                            <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please Add Valid Branch!">
                                <input nz-input type="text" formControlName="branch"  placeholder="Branch" />
                            </nz-form-control>
                        </nz-form-item>
                    </div>

                </div>
            </div>
            <div class="mt-2">
                <h5>
                    KYC Documents (Optional)
                </h5>
            </div>
            <ng-container *ngFor="let item of get_underwritingArr(addEditProductForm); let k = index;"
                formArrayName="document_data">
                <div class="col-md-12" [formGroupName]="k">
                    <div class="row">
                        <div class="col-md-7 pl-0">
                            <nz-form-item>
                                <nz-form-label [nzSm]="7" [nzXs]="24" nzFor="min" class="text-left" nzRequired>
                                    {{item.controls.label_name.value}}</nz-form-label>
                                <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please Add {{item.controls.label_name.value}}!">
                                    <div class="d-flex">
                                        <label class="mr-3 mt-2 d-flex" formControlName="is_verified"  nz-checkbox >Verify</label> 
                                        <nz-upload
                                        [nzMultiple]="'false'" [nzAccept]="'.png, .jpg, .pdf'"
                                        [nzCustomRequest]="customUpload"
                                        (nzChange)="onUpload($event, k, 'upload')"
                                        >
                                        <!-- <button nz-button>
                                            <i nz-icon nzType="upload"></i>
                                            Click to Upload
                                        </button> -->
                                        <button nz-button type="button"><i nz-icon nzType="upload"></i>{{item.controls.document_name.value ? 'Re Upload' :    '  Upload ' }}</button>
                                        </nz-upload>
                                    </div>
                                    <!-- (nzChange)="onUpload($event)"[nzBeforeUpload]="beforeUpload" [nzBeforeUpload]="beforeUpload" <input type="file" formControlName="documents" > -->
                                    <!-- <input nz-input type="number" min="0" formControlName="label_name"
                                            placeholder="Please input {{item.controls.label_name.value}}!" /> -->
                                    <!-- <input type="file" /> -->
                                </nz-form-control>
                            </nz-form-item>
                        </div>
                        <div class="col-md-2 pl-0 mt-2" >
                            <i (click)='deleteDocumentByDocumentId(k)' *ngIf="item.controls.document_name.value" nz-icon nzType="delete" nzTheme="outline" style="font-size: 1rem; cursor: pointer; color: red;"></i>
                        </div>
                        <!-- <div class="col-md-6">
                                <nz-form-item>
                                    <nz-form-label nzFor="max" class="text-left" nzRequired>{{item.controls.max_label.value}}</nz-form-label>
                                    <nz-form-control nzErrorTip="Please input {{item.controls.max_label.value}}!">
                                        <input nz-input type="number" min="0" formControlName="max"
                                            placeholder="Please input {{item.controls.max_label.value}}!" />
                                    </nz-form-control>
                                </nz-form-item>
                            </div> -->
                    </div>
                </div>
            </ng-container>
            <div class="row no-gutters">
                <div class="col-12 d-flex justify-content-between">
                    <button nz-button nzType="link" class="pl-0" (click)="isVisible = true">+Add Document</button>
                </div>
            </div>

            <div class="row border-top mt-2">
                <div class="col-md-6 mt-4">
                    <nz-form-item>
                        <nz-form-label [nzSm]="8" [nzXs]="24" nzFor="corporation_category" class="text-left" nzRequired>Corp Category</nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="Please select Valid Corporation Category">
                            <nz-select formControlName="corporation_category" nzPlaceHolder="Select Corporation Category"
                                (nzFocus)="getListOfCorp()" nzShowSearch nzAllowClear
                                (nzOnSearch)="onSearchGetList($event, 'corp')">
                                <nz-option *ngFor="let item of corpArr" [nzValue]="item.id"
                                    [nzLabel]="item.category_name">
                                </nz-option>
                            </nz-select>
                        </nz-form-control>
                    </nz-form-item>
                    <!-- <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="state" class="text-left" nzRequired>Corp Category</nz-form-label>
                        <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please Add Valid Corp Category !">
                            <input nz-input type="text" formControlName="state"  placeholder="State"/>
                        </nz-form-control>
                    </nz-form-item> -->
                </div>
                <div class="col-md-12 mt-4">
                    <nz-form-item>
                        <nz-form-label [nzSm]="4" [nzXs]="24" nzFor="payout" class="text-left" nzRequired>Payout</nz-form-label>
                    <nz-form-control [nzSm]="7" [nzXs]="24" nzErrorTip="Please select Valid Payout Option!">
                            <nz-radio-group formControlName='payout'>
                                <label nz-radio nzValue="yes">Yes</label>
                                <label nz-radio nzValue="no">No</label>
                                <label nz-radio nzValue="na">N/A</label>
                            </nz-radio-group>
                        </nz-form-control>
                    </nz-form-item>
                </div>
            </div>


        </form>
    </nz-card>
    <div class="row my-3 justify-content-between">
        <div class="col-3">
            <button nzType="primary" *ngIf="!isEdit" nz-button type="submit" [nzLoading]="apiLoader['saveAddNew']" [disabled]="apiLoader['formSave']" (click)="onClickSaveExistingForm($event)">Save & Add New</button>
        </div>
        <div class="col-3 text-right">
            <button type="submit" (click)="onClickSubmitForm()" [nzLoading]="apiLoader['formSave']" [disabled]="apiLoader['saveAddNew']" nz-button nzType="primary">Save</button>
        </div>

    </div>
</section>

<nz-modal [(nzVisible)]="isVisible" nzTitle="Add New Document" (nzOnCancel)="handleCancel()" (nzOnOk)="addRule()">
    <ng-container *nzModalContent>
        <nz-form-label [nzSm]="7" [nzXs]="24" class="text-left" nzRequired>Select Document</nz-form-label>
        <nz-select [(ngModel)]="selectedDocument" nzPlaceHolder="Select Select Entity!">
            <nz-option *ngFor="let item of documentArray" [nzValue]="item" [nzLabel]="item.name">
            </nz-option>
        </nz-select>
    </ng-container>
</nz-modal>
